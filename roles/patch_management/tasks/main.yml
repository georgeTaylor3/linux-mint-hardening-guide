---
# Mirrors patch-management/README.md — fully automatable, no secrets.

- name: Install unattended-upgrades and needrestart
  ansible.builtin.apt:
    name:
      - unattended-upgrades
      - needrestart
    state: present
    update_cache: "{{ not (offline | bool) }}"

- name: Enable periodic update checks and unattended-upgrades
  ansible.builtin.copy:
    dest: /etc/apt/apt.conf.d/20auto-upgrades
    content: |
      APT::Periodic::Update-Package-Lists "1";
      APT::Periodic::Unattended-Upgrade "1";
    mode: "0644"

- name: Enable housekeeping (remove unused dependencies)
  ansible.builtin.lineinfile:
    path: /etc/apt/apt.conf.d/50unattended-upgrades
    regexp: '^\/\/Unattended-Upgrade::Remove-Unused-Dependencies'
    line: 'Unattended-Upgrade::Remove-Unused-Dependencies "true";'

- name: Keep automatic reboot explicitly OFF (deliberate — control your own reboots)
  ansible.builtin.lineinfile:
    path: /etc/apt/apt.conf.d/50unattended-upgrades
    regexp: '^\/\/Unattended-Upgrade::Automatic-Reboot "false";'
    line: 'Unattended-Upgrade::Automatic-Reboot "false";'

- name: Enable syslog logging for unattended-upgrades
  ansible.builtin.lineinfile:
    path: /etc/apt/apt.conf.d/50unattended-upgrades
    regexp: '^\/\/ ?Unattended-Upgrade::SyslogEnable'
    line: 'Unattended-Upgrade::SyslogEnable "true";'

- name: Confirm the Ubuntu base is noble (51unattended-upgrades-mint names it)
  ansible.builtin.command: grep -q '^UBUNTU_CODENAME=noble$' /etc/os-release
  changed_when: false

- name: Add Ubuntu, Mint, and third-party origins (the stock ones match nothing on Mint)
  ansible.builtin.copy:
    dest: /etc/apt/apt.conf.d/51unattended-upgrades-mint
    content: |
      // Linux Mint 22.x (Ubuntu noble base). The stock Allowed-Origins expand to
      // "Linuxmint:zena", which matches neither the Ubuntu repositories nor the
      // "linuxmint" origin. Update "noble" and "zena" when moving to Mint 23.
      // Left for manual updates: google-cloud-cli, neovim (nightly PPA).
      Unattended-Upgrade::Origins-Pattern {
              "origin=Ubuntu,archive=noble-security";
              "origin=Ubuntu,archive=noble-updates";
              "origin=linuxmint,archive=zena";
              "origin=Brave Software,archive=stable";
              "origin=proton-gitlab,codename=stable,site=repo.protonvpn.com";
              "origin=code stable,archive=stable";
      };
    owner: root
    group: root
    mode: "0644"

- name: Apply any currently pending updates now, rather than waiting for the timer
  ansible.builtin.apt:
    upgrade: dist
    update_cache: true
  when: not (offline | bool)

- name: Confirm apt-daily-upgrade.timer is enabled
  ansible.builtin.systemd:
    name: apt-daily-upgrade.timer
    enabled: true
    state: started
