---
# Dispatches on the distribution family. Debian covers Linux Mint and
# RedHat covers Fedora. Static imports keep the role's tags on every
# imported task, so --tags backups_setup selects the whole role.

- name: Stop on an unsupported distribution family
  ansible.builtin.fail:
    msg: >-
      This role supports Debian-family (Linux Mint) and RedHat-family
      (Fedora) systems. Found: {{ ansible_facts['os_family'] }}.
  when: ansible_facts['os_family'] not in ['Debian', 'RedHat']

- name: Import the Debian-family tasks
  ansible.builtin.import_tasks: Debian.yml
  when: ansible_facts['os_family'] == 'Debian'

- name: Import the RedHat-family tasks
  ansible.builtin.import_tasks: RedHat.yml
  when: ansible_facts['os_family'] == 'RedHat'
